name: Build and security checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Core regression checks
        run: ./test.sh
      - name: C static security analysis
        run: |
          mkdir -p build/security
          xcrun clang --analyze -Wall -Wextra -Werror -Xanalyzer -analyzer-checker=core,unix,security Tools/Guardian.c -o build/security/guardian.plist
          xcrun clang --analyze -Wall -Wextra -Werror -Xanalyzer -analyzer-checker=core,unix,security Tools/ResourceProbe.c -o build/security/resource-probe.plist
          python3 -c 'import plistlib; reports = ["build/security/guardian.plist", "build/security/resource-probe.plist"]; raise SystemExit(any(plistlib.load(open(path, "rb")).get("diagnostics") for path in reports))'
      - name: Recovery protocol sanitizers
        run: |
          xcrun clang -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all Tools/Guardian.c -framework CoreGraphics -o build/security/LanternGuardian-sanitized
          python3 Tests/guardian_protocol.py build/security/LanternGuardian-sanitized
      - name: Native app build
        run: ./build.sh
      - name: Verify local signatures
        run: codesign --verify --deep --strict 'build/Red Lantern.app'
      - name: Universal release packaging and extraction checks
        run: ./release.sh

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download checksum-pinned Gitleaks
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan all history without secret allow comments
        run: '"$RUNNER_TEMP/gitleaks" git --log-opts=--all --redact=100 --ignore-gitleaks-allow --no-banner .'
